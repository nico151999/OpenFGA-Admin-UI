replicaCount: 1

image:
  repository: ghcr.io/yehia2amer/openfga-admin-ui
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

persistence:
  config:
    enabled: true
    existingClaim: ""
    mountPath: /home/app/.openfga-admin
    size: 1Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce

service:
  type: ClusterIP
  port: 80
  targetPort: 4000

gatewayRoute:
  enabled: false
  parentRefs:
    - name: gateway
      namespace: default
  hostnames:
    - openfga-admin.local
  rules:
    - backendRefs:
        - name: ""
          port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: openfga-admin.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health/ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}

env:
  NODE_ENV: production
  PORT: "4000"
  LOG_LEVEL: info
  DEFAULT_OPENFGA_URL: http://openfga.openfga-system.svc.cluster.local:8080
